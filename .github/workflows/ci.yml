name: CI

on:
  push:
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  types-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
      - run: pnpm exec tsc -b

  spell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
      - run: pnpm add -g cspell
      - run: pnpm exec cspell '{packages,apps}/*/src/**/*.{ts,tsx}'

  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
      - run: pnpm run format:check

  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
      - run: pnpm run lint

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
      - run: pnpm --filter @cah/store --filter @cah/utils run test

  server-tests:
    runs-on: ubuntu-latest
    container: node:24

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: tests
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
      - run: pnpm --filter @cah/server run test
        env:
          DATABASE_URL: postgres://postgres@postgres:5432/tests
