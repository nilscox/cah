name: CI

on:
  push:
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  types-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          cache: true
          run_install: true
      - run: pnpm exec tsc -b

  spell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          cache: true
          run_install: true
      - run: pnpm add -g cspell@6 @cspell/dict-fr-fr
      - run: pnpm exec cspell link add @cspell/dict-fr-fr
      - run: pnpm exec cspell --locale en 'packages/*/src/**/*.{ts,tsx}'

  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          cache: true
          run_install: true
      - run: pnpm -r --filter='!eslint-config' exec prettier --check src

  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          cache: true
          run_install: true
      - run: pnpm -r run lint

  tests:
    runs-on: ubuntu-latest
    container: node:24-slim

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: tests
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          cache: true
          run_install: true
      - run: pnpm --filter @cah/server run test
        env:
          DATABASE_URL: postgres://postgres@postgres:5432/tests
