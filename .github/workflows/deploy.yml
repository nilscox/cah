name: Deploy

on:
  workflow_run:
    branches: [master]
    workflows: [CI]
    types: [completed]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        image: [server, web]

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image }}
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache,mode=max

  deploy:
    name: Deploy
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: server
            webhook: COOLIFY_SERVER_WEBHOOK
          - name: web
            webhook: COOLIFY_WEB_WEBHOOK
    steps:
      - name: Deploy ${{ matrix.name }}
        run: |
          curl --fail-with-body -X POST "${{ secrets[matrix.webhook] }}" -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
